<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Page 01 - Formulario</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/page01.css" />
  </head>
  <body>
    <nav class="top-nav">
      <span class="brand">PC1 · DAW</span>
      <a href="index.html">Inicio</a>
      <a href="page01.html">Page01</a>
      <a href="page02.html">Page02</a>
      <a href="page03.html">Page03</a>
    </nav>

    <div class="page-wrap">
      <!-- ================= 2.a Floating label demo ================= -->
      <h2 class="section-title">2.a · Animación de label flotante</h2>
      <div class="demo-field demo-field-box">
        <input type="text" id="emailDemo" placeholder=" " autocomplete="off" />
        <label for="emailDemo">Email</label>
      </div>

      <!-- ================= 2.b / 2.c Ventana con formulario ================= -->
      <div class="browser-window">
        <div class="browser-titlebar">
          <!-- icono 1: sol -->
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            />
          </svg>
          <!-- icono 2: bandera -->
          <svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 3 2 3H5" /></svg>
          <!-- icono 3: copiar -->
          <svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
          <!-- icono 4: code -->
          <svg viewBox="0 0 24 24"><path d="M8 6L2 12l6 6M16 6l6 6-6 6" /></svg>
        </div>

        <form class="browser-body" id="mainForm">
          <div class="field">
            <input type="text" id="fName" placeholder=" " autocomplete="off" />
            <label for="fName">Name</label>
          </div>

          <div class="field">
            <input
              type="email"
              id="fEmail"
              placeholder=" "
              autocomplete="off"
            />
            <label for="fEmail">E-mail</label>
          </div>

          <div class="field item">
            <input type="text" id="fItem" placeholder=" " autocomplete="off" />
            <label for="fItem">Item</label>
          </div>

          <!-- ============ 2.c campo imagen drag & drop ============ -->
          <div class="drop-field" id="dropField">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <circle cx="9" cy="10" r="1.5" />
              <path d="M21 16l-5-5-4 4-2-2-5 5" />
            </svg>
            <span id="dropText">Arrastra una imagen aquí</span>
          </div>
          <input
            type="file"
            id="fileInput"
            accept="image/*"
            style="display: none"
          />

          <label class="checkbox-row">
            <input type="checkbox" id="agree" />
            Do you agree?
          </label>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">SUBMIT</button>
            <button type="reset" class="btn btn-secondary">CLEAR</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const dropField = document.getElementById("dropField");
      const dropText = document.getElementById("dropText");
      const fileInput = document.getElementById("fileInput");

      function showFile(file) {
        if (!file) return;
        // pathname simulado (los navegadores no exponen la ruta real por seguridad)
        dropText.textContent = file.name;
        dropField.title = file.name;
      }

      dropField.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => showFile(e.target.files[0]));

      ["dragenter", "dragover"].forEach((evt) =>
        dropField.addEventListener(evt, (e) => {
          e.preventDefault();
          dropField.classList.add("dragover");
        }),
      );
      ["dragleave", "drop"].forEach((evt) =>
        dropField.addEventListener(evt, (e) => {
          e.preventDefault();
          dropField.classList.remove("dragover");
        }),
      );
      dropField.addEventListener("drop", (e) => {
        const file = e.dataTransfer.files[0];
        showFile(file);
      });

      document.getElementById("mainForm").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Formulario enviado (demo).");
      });
    </script>
  </body>
</html>
