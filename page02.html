<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Page 02 - Shipping & Color Picker</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/page02.css" />
  </head>
  <body>
    <nav class="top-nav">
      <span class="brand">PC1 · DAW</span>
      <a href="index.html">Inicio</a>
      <a href="page01.html">Page01</a>
      <a href="page02.html">Page02</a>
      <a href="page03.html">Page03</a>
    </nav>

    <div class="page-wrap">
      <!-- ================= 3.a Ventana con tabs y radio buttons ================= -->
      <div class="browser-window">
        <div class="browser-titlebar">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            />
          </svg>
          <svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 3 2 3H5" /></svg>
          <svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
          <svg viewBox="0 0 24 24"><path d="M8 6L2 12l6 6M16 6l6 6-6 6" /></svg>
        </div>

        <div class="steps">
          <div class="step"><span class="dot">1</span>Review Order</div>
          <div class="step active">
            <span class="dot">2</span>Select Shipping
          </div>
          <div class="step"><span class="dot">3</span>Submit</div>
        </div>

        <div class="shipping-body">
          <h3>Shipping</h3>
          <div class="delivery-label">Delivery Method</div>

          <label class="radio-row">
            <input type="radio" name="shipping" value="standard" checked />
            Standard Shipping
          </label>
          <label class="radio-row">
            <input type="radio" name="shipping" value="priority" />
            Priority Shipping
          </label>
          <label class="radio-row">
            <input type="radio" name="shipping" value="express" />
            Express Shipping
          </label>
        </div>

        <div class="step-nav">
          <button class="link-btn">PREVIOUS</button>
          <button class="btn-next">NEXT</button>
        </div>
      </div>

      <!-- ================= 3.b Card de color con sliders ================= -->
      <div class="color-card">
        <div class="color-preview" id="colorPreview"></div>
        <div class="color-controls">
          <div class="slider-row">
            <label>R</label>
            <input type="range" id="rSlider" min="0" max="255" value="80" />
            <input type="number" id="rInput" min="0" max="255" value="80" />
          </div>

          <div class="slider-row">
            <label>G</label>
            <input type="range" id="gSlider" min="0" max="255" value="165" />
            <input type="number" id="gInput" min="0" max="255" value="165" />
          </div>

          <div class="slider-row">
            <label>B</label>
            <input type="range" id="bSlider" min="0" max="255" value="92" />
            <input type="number" id="bInput" min="0" max="255" value="92" />
          </div>
        </div>
      </div>
    </div>

    <script>
      const preview = document.getElementById("colorPreview");
      const channels = ["r", "g", "b"];

      function updateColor() {
        const r = document.getElementById("rSlider").value;
        const g = document.getElementById("gSlider").value;
        const b = document.getElementById("bSlider").value;
        preview.style.background = `rgb(${r}, ${g}, ${b})`;
      }

      channels.forEach((ch) => {
        const slider = document.getElementById(ch + "Slider");
        const number = document.getElementById(ch + "Input");

        slider.addEventListener("input", () => {
          number.value = slider.value;
          updateColor();
        });
        number.addEventListener("input", () => {
          let v = Math.min(255, Math.max(0, Number(number.value) || 0));
          slider.value = v;
          updateColor();
        });
      });

      updateColor();
    </script>
  </body>
</html>
