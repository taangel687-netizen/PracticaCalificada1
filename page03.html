<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 03 - Tienda</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/page03.css" />
  </head>
  <body class="p3">
    <nav class="top-nav">
      <span class="brand">PC1 · DAW</span>
      <a href="index.html">Inicio</a>
      <a href="page01.html">Page01</a>
      <a href="page02.html">Page02</a>
      <a href="page03.html">Page03</a>
    </nav>

    <div class="store">
      <h2 class="section-heading">Lo Más Vendido ⭐</h2>

      <div class="store-tabs">
        <button class="tab active">DAMAS</button>
        <button class="tab">CABALLEROS</button>
        <button class="tab">KIDS</button>
      </div>

      <div class="product-grid">
        <div class="product-card">
          <div class="product-img">
            <img
              src="assets/img/botas.jpg"
              alt="Botas Sokso"
              class="hover-opacity"
            />
          </div>
          <div class="product-tag">BOTAS SOKSO S/.189 ›</div>
        </div>
        <div class="product-card">
          <div class="product-img">
            <img
              src="assets/img/botas.jpg"
              alt="Zapatilla Sokso"
              class="hover-opacity"
            />
          </div>
          <div class="product-tag">ZAPATILLA SOKSO S/.119 ›</div>
        </div>
        <div class="product-card">
          <div class="product-img">
            <img
              src="assets/img/botas.jpg"
              alt="Zapatos Estela"
              class="hover-opacity"
            />
          </div>
          <div class="product-tag">ZAPATOS ESTELA SOKSO S/.279 ›</div>
        </div>
        <div class="product-card">
          <div class="product-img">
            <img
              src="assets/img/zapatos-simik.jpg"
              alt="Zapatos Simik"
              class="hover-opacity"
            />
          </div>
          <div class="product-tag">ZAPATOS NIÑA SIMIK S/.149 ›</div>
        </div>
      </div>

      <h2 class="section-heading">Grandes Marcas 🌍👟</h2>

      <div class="brands-row">
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/adidas-hombre.jpg"
              alt="Adidas Hombre"
              class="hover-opacity"
            />
          </div>
          Adidas Hombre
        </div>
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/adidas-mujer.jpg"
              alt="Adidas Mujer"
              class="hover-opacity"
            />
          </div>
          Adidas Mujer
        </div>
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/nike-hombre.jpg"
              alt="Nike Hombre"
              class="hover-opacity"
            />
          </div>
          Nike Hombre
        </div>
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/nike-mujer.jpg"
              alt="Nike Mujer"
              class="hover-opacity"
            />
          </div>
          Nike Mujer
        </div>
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/puma-hombre.jpg"
              alt="Puma Hombre"
              class="hover-opacity"
            />
          </div>
          Puma Hombre
        </div>
        <div class="brand-item">
          <div class="brand-circle">
            <img
              src="img/puma-mujer.jpg"
              alt="Puma Mujer"
              class="hover-opacity"
            />
          </div>
          Puma Mujer
        </div>
      </div>

      <div class="banner-row">
        <div class="banner boots">
          <img
            src="img/banner-botas.jpg"
            alt="Colección Botas"
            class="banner-bg hover-opacity"
          />
          <span class="banner-title">Botas</span>
          <span class="banner-btn">ver colección</span>
        </div>
        <div class="banner sneakers">
          <img
            src="img/banner-zapatillas.jpg"
            alt="Colección Zapatillas"
            class="banner-bg hover-opacity"
          />
          <span class="banner-title">Zapatillas</span>
          <span class="banner-btn">ver colección</span>
        </div>
      </div>
    </div>

    <script>
      document.querySelectorAll(".store-tabs .tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".store-tabs .tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
        });
      });
    </script>
  </body>
</html>
